name: C++ CI/CD Pipeline

on:
  push:
    branches: [ "main", "feature/*" ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-analyze:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y g++ cmake lcov cppcheck

    - name: Configure CMake (with Coverage)
      run: cmake -B build -DENABLE_COVERAGE=ON

    - name: Build Project
      run: cmake --build build

    - name: Run Unit Tests
      run: |
        ./build/set_tests
        ./build/poly_tests

    - name: Show Code Coverage
      run: |
        cd build
        lcov --capture --directory . --output-file coverage.info
        lcov --remove coverage.info '/usr/*' --output-file coverage.info
        lcov --list coverage.info

    - name: Run Static Analysis (Linter)
      run: |
        cppcheck --enable=warning,performance -I include src/

  build-release:
    needs: test-and-analyze
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
    - uses: actions/checkout@v3

    - name: Build Release Binaries
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build --config Release

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          build/set_app
          build/poly_app
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
