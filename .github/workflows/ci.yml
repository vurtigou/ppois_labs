name: Labs CI/CD

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'release/lab4-v*'
    tags:
      - 'lab1-v*'
      - 'lab2-v*'
      - 'lab4-v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lab1:
    name: Lab 1 — build, tests, coverage and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake lcov cppcheck
      - name: Configure with coverage
        run: cmake -S . -B build -DENABLE_COVERAGE=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Run unit tests
        run: |
          ./build/set_tests
          ./build/poly_tests
      - name: Check line coverage (at least 90%)
        shell: bash
        run: |
          lcov --capture --directory build --output-file build/coverage.info
          lcov --remove build/coverage.info '/usr/*' '*/tests/*' --output-file build/coverage.info
          lcov --list build/coverage.info
          COVERAGE="$(lcov --summary build/coverage.info 2>&1 | sed -nE 's/.*lines[^:]*:[[:space:]]*([0-9]+([.][0-9]+)?)%.*/\1/p' | tail -n 1)"
          if [[ -z "$COVERAGE" ]]; then
            echo "Could not read line coverage from lcov."
            exit 1
          fi
          echo "Line coverage: $COVERAGE%"
          awk -v coverage="$COVERAGE" 'BEGIN { exit !(coverage >= 90.0) }' || {
            echo "Line coverage is below 90%."
            exit 1
          }
      - name: Run cppcheck
        run: cppcheck --enable=warning,performance --error-exitcode=1 -I include app src tests

  lab2:
    name: Lab 2 — build, tests, coverage and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make python3 cppcheck
      - name: Run tests
        run: make test
      - name: Check coverage (strictly above 90%)
        run: make coverage
      - name: Run cppcheck
        run: cppcheck --enable=warning,performance --error-exitcode=1 -I include app src tests

  lab4:
    name: Lab 4 — build, tests, coverage, lint and docs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab4
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make python3 cppcheck doxygen
      - name: Build
        run: make
      - name: Run unit and CLI tests
        run: make test
      - name: Check coverage (strictly above 90%)
        run: make coverage
      - name: Run static analysis
        run: make lint
      - name: Generate documentation
        run: make docs
      - name: Package Linux executable
        run: |
          mkdir -p dist
          cp build/lab4 dist/lab4
          cp README.md dist/README.md
          tar -czf lab4-linux-x86_64.tar.gz -C dist .
      - name: Verify packaged executable
        run: |
          mkdir -p /tmp/lab4-release
          tar -xzf lab4-linux-x86_64.tar.gz -C /tmp/lab4-release
          test -x /tmp/lab4-release/lab4
          /tmp/lab4-release/lab4 </dev/null
      - name: Upload Lab 4 build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lab4-linux-x86_64
          path: lab4/lab4-linux-x86_64.tar.gz
          if-no-files-found: error

  release-lab1:
    name: Release Lab 1
    needs: [lab1, lab2, lab4]
    if: startsWith(github.ref, 'refs/tags/lab1-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ cmake
      - name: Build Lab 1 release binaries
        working-directory: lab1
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
      - name: Publish Lab 1 release
        uses: softprops/action-gh-release@v2
        with:
          name: Lab 1 ${{ github.ref_name }}
          files: |
            lab1/build/set_app
            lab1/build/poly_app
          draft: false
          prerelease: false

  release-lab2:
    name: Release Lab 2
    needs: [lab1, lab2, lab4]
    if: startsWith(github.ref, 'refs/tags/lab2-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ make
      - name: Build Lab 2 release binary
        working-directory: lab2
        run: |
          make clean
          make
      - name: Publish Lab 2 release
        uses: softprops/action-gh-release@v2
        with:
          name: Lab 2 ${{ github.ref_name }}
          files: lab2/build/oceanarium
          draft: false
          prerelease: false

  release-lab4:
    name: Release Lab 4
    needs: [lab1, lab2, lab4]
    if: startsWith(github.ref, 'refs/tags/lab4-v') || startsWith(github.ref, 'refs/heads/release/lab4-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Determine release tag
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "tag=${REF_NAME#release/}" >> "$GITHUB_OUTPUT"
      - name: Download verified Lab 4 archive
        uses: actions/download-artifact@v4
        with:
          name: lab4-linux-x86_64
      - name: Publish Lab 4 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Lab 4 ${{ steps.version.outputs.tag }}
          overwrite_files: false
          files: lab4-linux-x86_64.tar.gz
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
