name: C++ CI/CD Pipeline

on:
  push:
    branches: [ "main", "feature/*" ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ "main" ]

jobs:
  # 1. ТЕСТЫ, ПОКРЫТИЕ И ЛИНТЕР
  test-and-analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./lab1 # Указываем, что работаем в папке lab1

    steps:
    - uses: actions/checkout@v3

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y g++ cmake lcov cppcheck

    - name: Configure CMake (with Coverage)
      run: cmake -B build -DENABLE_COVERAGE=ON

    - name: Build Project
      run: cmake --build build

    - name: Run Unit Tests
      run: |
        ./build/set_tests
        ./build/poly_tests

    - name: Check Code Coverage (>90%)
      run: |
        cd build
        lcov --capture --directory . --output-file coverage.info
        lcov --remove coverage.info '/usr/*' --output-file coverage.info
        lcov --list coverage.info
        
        COVERAGE=$(lcov --list coverage.info | grep "Total:" | awk '{print $2}' | sed 's/%//')
        echo "Текущее покрытие: $COVERAGE%"
        if (( $(echo "$COVERAGE < 90.0" | bc -l) )); then
          echo "ОШИБКА: Покрытие меньше 90%!"
          exit 1
        fi

    - name: Run Static Analysis (Linter)
      run: |
        cppcheck --enable=all --suppress=missingIncludeSystem --error-exitcode=1 src/ include/

  # 2. РЕЛИЗ (Запускается только если создан тег v*)
  build-release:
    needs: test-and-analyze
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    defaults:
      run:
        working-directory: ./lab1

    steps:
    - uses: actions/checkout@v3

    - name: Build Release Binaries
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build --config Release

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          lab1/build/set_app
          lab1/build/poly_app
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
