name: Lab 2 CI (Oceanarium)

on:
  push:
    branches: [ "main" ]
    paths:
      - 'lab2/**' 
      - '.github/workflows/lab2_ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'lab2/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./lab2 

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y g++ make gcov python3 cppcheck

    - name: Build and Run Tests
      # Это вызовет твой Makefile (make test)
      run: make test

    - name: Check Code Coverage (>90%)
      run: make coverage

    - name: Run Static Analysis (Linter)
      run: |
        cppcheck --enable=warning,performance -I include app/ src/ tests/ || true
